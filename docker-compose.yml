services:
  aidataanalyst:
    build:
      context: .
    container_name: aidataanalyst
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      E2B_API_KEY: ${E2B_API_KEY}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      CSV_BUCKET_NAME: ${CSV_BUCKET_NAME:-data_csv}
      IMAGE_BUCKET_NAME: ${IMAGE_BUCKET_NAME:-data_image}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - proxy

networks:
  proxy:
    name: vps_proxy
    external: true
