name: Deploy to Hostinger VPS

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PROJECT_NAME: aidataanalyst

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy Docker Compose project to Hostinger
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_VPS_ID: ${{ secrets.HOSTINGER_VPS_ID }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -euo pipefail

          CONTENT="$(cat <<'COMPOSE'
          services:
            aidataanalyst:
              image: __IMAGE__
              restart: unless-stopped
              expose:
                - "8000"
              environment:
                OPENAI_API_KEY: ${OPENAI_API_KEY}
                E2B_API_KEY: ${E2B_API_KEY}
                SUPABASE_URL: ${SUPABASE_URL}
                SUPABASE_KEY: ${SUPABASE_KEY}
                CSV_BUCKET_NAME: ${CSV_BUCKET_NAME:-data_csv}
                IMAGE_BUCKET_NAME: ${IMAGE_BUCKET_NAME:-data_image}
                LOG_LEVEL: ${LOG_LEVEL:-INFO}

              networks:
                - proxy

          networks:
            proxy:
              name: vps_proxy
              external: true
          COMPOSE
          )"
          CONTENT="${CONTENT/__IMAGE__/$IMAGE}"

          ENVIRONMENT="$(cat <<ENV
          OPENAI_API_KEY=${OPENAI_API_KEY}
          E2B_API_KEY=${E2B_API_KEY}
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_KEY=${SUPABASE_KEY}
          CSV_BUCKET_NAME=data_csv
          IMAGE_BUCKET_NAME=data_image
          LOG_LEVEL=INFO
          ENV
          )"

          jq -n \
            --arg project_name "$PROJECT_NAME" \
            --arg content "$CONTENT" \
            --arg environment "$ENVIRONMENT" \
            '{project_name: $project_name, content: $content, environment: $environment}' \
            > hostinger-payload.json

          curl --fail-with-body \
            --request POST \
            --url "https://developers.hostinger.com/api/vps/v1/virtual-machines/${HOSTINGER_VPS_ID}/docker" \
            --header "Authorization: Bearer ${HOSTINGER_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --header "Accept: application/json" \
            --data @hostinger-payload.json
