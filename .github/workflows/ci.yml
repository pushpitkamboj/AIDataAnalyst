name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall -q src

      - name: Import FastAPI app
        env:
          PYTHONPATH: src
          OPENAI_API_KEY: test
          E2B_API_KEY: test
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_KEY: test
        run: python -c "from api.main import app; print(len(app.routes))"

      - name: Build Docker image
        run: docker build -t aidataanalyst:test .
